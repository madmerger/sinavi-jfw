buildscript {
    repositories {
        mavenCentral()
        maven { url 'https://plugins.gradle.org/m2/' }
    }
    dependencies {
        classpath 'com.github.spotbugs.snom:spotbugs-gradle-plugin:5.2.5'
    }
}

allprojects {
    apply plugin : 'java'
    apply plugin : 'eclipse'
    apply plugin : 'checkstyle'
    apply plugin : 'com.github.spotbugs'
    apply plugin : 'jacoco'
    apply plugin : 'idea'
    apply plugin : 'signing'
    apply plugin : 'maven-publish'
    apply plugin : 'project-report'

    repositories {
        mavenCentral()
        maven {
            url 'https://repo.spring.io/plugins-release'
        }
        maven {
            url 'https://repo.spring.io/snapshot'
        }
    }

    eclipse {
        classpath {
            downloadSources=true
        }
    }

    [javadoc]*.options*.encoding = 'UTF-8'
    [compileJava, compileTestJava].each {
        it.sourceCompatibility = JavaVersion.VERSION_1_8
        it.targetCompatibility = JavaVersion.VERSION_1_8
        it.options.encoding = 'UTF-8'
    }

    configurations {
        all*.exclude group: "commons-logging", module: "commons-logging"
    }

    ext {
        springVersion = '4.0.2.RELEASE'
        springMongoVersion = '1.4.3.RELEASE'
        springAmqpVersion = '1.3.0.RELEASE'
        springRetryVersion = '1.0.3.RELEASE'
        jaxRsVersion = '2.0'
        jacksonVersion = '1.9.13'
        jerseyVersion = '2.7'
        mybatisVersion = '3.2.5'
        mybatisSpringVersion = '1.2.2'
        beanValidationVersion = '1.1.0.Final'
        hibernateValidatorVersion = '5.1.0.Final'
        elVersion = '2.2.4'
        commonsFileuploadVersion = '1.3.1'
        commonsValidatorVersion = '1.4.0'
        commonsDbcpVersion = '1.4'
        commonsIoVersion = '2.0.1'
        commonsCollectionsVersion = '3.2.1'
        commonsLangVersion = '2.6'
        commonsCodecVersion = '1.5'
        slf4jVersion = '1.7.6'
        logbackVersion = '1.1.1'
        guavaVersion = '16.0.1'
        openCsvVersion = '2.3'
        
        junitVersion = '4.11'
        mockitoVersion = '1.9.5'
        h2Version = '1.3.173'
        
        servletApiVersion = '3.0.1'
        cglibVersion = '3.1'
        asmVersion = '3.3.1'
        aspectjVersion = '1.7.3'
        jspApiVersion = '2.2'
        jstlVersion = '1.2'
        
        checkstyleVersion = '5.6'
        spotbugsVersion = '4.8.6'
    }

    dependencies {
        implementation "org.slf4j:slf4j-api:${slf4jVersion}"
        implementation "ch.qos.logback:logback-classic:${logbackVersion}"
        implementation "org.slf4j:jcl-over-slf4j:${slf4jVersion}"
        implementation "com.google.guava:guava:${guavaVersion}"
        implementation "commons-lang:commons-lang:${commonsLangVersion}"
        testImplementation "junit:junit:${junitVersion}"
        testImplementation "org.mockito:mockito-core:${mockitoVersion}"
        testRuntimeOnly "javax.xml.bind:jaxb-api:2.3.1"
        testRuntimeOnly "org.glassfish.jaxb:jaxb-runtime:2.3.8"
        checkstyle "com.puppycrawl.tools:checkstyle:${checkstyleVersion}"
        spotbugs "com.github.spotbugs:spotbugs:${spotbugsVersion}"
        runtimeOnly "cglib:cglib-nodep:${cglibVersion}"
        runtimeOnly "asm:asm:${asmVersion}"
        runtimeOnly "org.aspectj:aspectjweaver:${aspectjVersion}"
        compileOnly "javax.servlet:javax.servlet-api:${servletApiVersion}"
    }

    test {
        testLogging {
            events "failed"
            exceptionFormat "full"
            debug {
                events "started", "skipped", "failed"
                exceptionFormat "full"
            }
        }
        exclude '**/*$*'
    }

    checkstyle {
        configFile = file("${rootDir}/config/checkstyle/ctc-checks.xml")
        ignoreFailures = true
        toolVersion = '5.6'
    }

    spotbugs {
        ignoreFailures = true
    }
    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        ignoreFailures = true
    }

    jacoco {
        toolVersion = '0.8.12'
    }

    jacocoTestReport {
        reports {
            xml.required.set(false)
            csv.required.set(false)
            html.outputLocation = layout.buildDirectory.dir("jacocoHtml")
        }
    }

    task resourceCopy(type: Copy) {
        dependsOn processResources, compileTestJava
        from processResources.destinationDir
        into compileTestJava.destinationDir
        include '**/*.xml'
        include '*.xml'
        include '*.properties'
    }

    test.dependsOn("resourceCopy")
    checkstyleTest.dependsOn("resourceCopy")
    spotbugsTest.dependsOn("resourceCopy")
    tasks.withType(Test).configureEach {
        jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'
        jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED'
        systemProperty 'user.language', 'ja'
        systemProperty 'user.country', 'JP'
    }

}

configure(rootProject) {
    tasks.named('wrapper', Wrapper) {
        description = "Generates gradlew[.bat] scripts"
        gradleVersion = "8.8"
    }

}

configure(subprojects) {subproject ->
    group = 'jp.co.ctc-g.jfw'
    defaultTasks 'clean', 'packages'
    java {
        withSourcesJar()
        withJavadocJar()
    }
    jar {
        doFirst {
            manifest.attributes["Created-By"] =  "${System.getProperty("java.version")}"
            manifest.attributes["Implementation-Vendor"] = 'ITOCHU Techno-Solutions Corporation.'
            manifest.attributes["Implementation-Title"] = subproject.name
            manifest.attributes["Implementation-Version"] = subproject.version
        }
    }
    javadoc {
        failOnError = false
        doFirst {
            description = "Generates project-level javadoc for use in -javadoc jar"
            options.memberLevel = org.gradle.external.javadoc.JavadocMemberLevel.PROTECTED
            options.author = true
            options.overview = "${rootDir}/config/javadoc/html/overview.html"
            options.charSet = 'UTF-8'
            options.docTitle  = "${subproject.name} ${subproject.version}"
            options.windowTitle  = "${subproject.name} ${subproject.version}"
            options.header = "<h1>${subproject.name}</h1>"
            options.bottom = "<i>Copyright &#169; 2011-2014 ITOCHU Techno-Solutions Corporation.</i>"
            options.destinationDirectory = file("${project.docsDir}/javadoc/${subproject.name}/${subproject.version}/api")
        }
    }
    afterEvaluate {
        publishing {
            publications {
                mavenJava(MavenPublication) {
                    from components.java
                    pom {
                        groupId = 'jp.co.ctc-g.jfw'
                        packaging = 'jar'
                        inceptionYear = '2014'
                        url = 'https://github.com/ctc-g/sinavi-jfw'
                        organization {
                            name = 'ITOCHU Techno-Solutions Corporation.'
                            url = 'https://www.ctc-g.co.jp'
                        }
                        licenses {
                            license {
                                name = 'The Apache Software License, Version 2.0'
                                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                                distribution = 'repo'
                            }
                        }
                        scm {
                            connection = 'scm:git:https://github.com/ctc-g/sinavi-jfw.git'
                            developerConnection = 'scm:git:https://github.com/ctc-g/sinavi-jfw.git'
                            url = 'https://github.com/ctc-g/sinavi-jfw'
                        }
                        developers {
                            developer {
                                id = 'sinavi-jfw'
                                name = 'SINAVI J-Framework'
                                email = 'sinavi-jframework@ctc-g.co.jp'
                            }
                        }
                        name = project.description
                        description = project.description
                    }
                }
            }
            repositories {
                maven {
                    url = uri('https://oss.sonatype.org/service/local/staging/deploy/maven2')
                    credentials {
                        username = findProperty('sonatypeUsername') ?: System.getenv('sonatypeUsername')
                        password = findProperty('sonatypePassword') ?: System.getenv('sonatypePassword')
                    }
                }
                maven {
                    url = uri('https://oss.sonatype.org/content/repositories/snapshots/')
                    credentials {
                        username = findProperty('sonatypeUsername') ?: System.getenv('sonatypeUsername')
                        password = findProperty('sonatypePassword') ?: System.getenv('sonatypePassword')
                    }
                }
            }
        }
        signing {
            required {
                gradle.taskGraph.allTasks.any { it.name.startsWith('publish') }
            }
            sign publishing.publications.mavenJava
        }
    }

    task codeChecks(dependsOn: [
        'checkstyleMain',
        'spotbugsMain',
    ])
    task packages(dependsOn: [
        'codeChecks',
        'jar',
        'sourcesJar',
        'javadocJar'
    ])
}

project("jfw-util-core") {
    description = 'SINAVI J-Framework Utility'
    defaultTasks 'clean', 'packages'
    dependencies {
        implementation "commons-collections:commons-collections:${commonsCollectionsVersion}"
        implementation "org.springframework:spring-beans:${springVersion}"
    }

}

project("jfw-resource-core") {
    description = 'SINAVI J-Framework Resource'
    defaultTasks 'clean', 'packages'
    dependencies {
        implementation project(':jfw-util-core')
        implementation "commons-collections:commons-collections:${commonsCollectionsVersion}"
        implementation "org.springframework:spring-core:${springVersion}",
                "org.springframework:spring-context:${springVersion}"
        testImplementation "org.springframework:spring-test:${springVersion}"
    }

}

project("jfw-exception-core") {
    description = 'SINAVI J-Framework Exception'
    defaultTasks 'clean', 'packages'
    dependencies {
        implementation project(':jfw-util-core')
        implementation project(':jfw-resource-core')
        implementation "commons-collections:commons-collections:${commonsCollectionsVersion}"
        implementation "org.springframework:spring-core:${springVersion}",
                "org.springframework:spring-context:${springVersion}"
        testImplementation "org.springframework:spring-test:${springVersion}"
    }

}

project("jfw-web-util-core") {
    description = 'SINAVI J-Framework Web Utility'
    defaultTasks 'clean', 'packages'
    dependencies {
        implementation project(':jfw-util-core')
        implementation project(':jfw-exception-core')
        implementation "commons-collections:commons-collections:${commonsCollectionsVersion}"
        implementation "org.springframework:spring-core:${springVersion}",
                "org.springframework:spring-context:${springVersion}"
        testImplementation "javax.servlet:javax.servlet-api:${servletApiVersion}"
        testImplementation "javax.annotation:javax.annotation-api:1.3.2"
        testImplementation "org.springframework:spring-test:${springVersion}"
    }

}

project("jfw-test") {
    description = 'SINAVI J-Framework Test Utility'
    defaultTasks 'clean', 'packages'
    dependencies {
        implementation project(':jfw-util-core')
        implementation "commons-io:commons-io:${commonsIoVersion}"
        implementation "commons-fileupload:commons-fileupload:${commonsFileuploadVersion}"
        implementation "junit:junit:${junitVersion}"
        implementation "org.mockito:mockito-core:${mockitoVersion}"
        implementation "org.springframework:spring-core:${springVersion}",
                "org.springframework:spring-context:${springVersion}",
                "org.springframework:spring-beans:${springVersion}",
                "org.springframework:spring-test:${springVersion}"
    }

}

project("jfw-data-mongodb-test") {
    description = 'SINAVI J-Framework MongoDB Test Utility'
    defaultTasks 'clean', 'packages'
    dependencies {
        implementation project(':jfw-test')
        implementation project(':jfw-util-core')
        implementation "commons-io:commons-io:${commonsIoVersion}"
        implementation "commons-fileupload:commons-fileupload:${commonsFileuploadVersion}"
        implementation "junit:junit:${junitVersion}"
        implementation "org.mockito:mockito-core:${mockitoVersion}"
        implementation "org.springframework:spring-test:${springVersion}"
        implementation "org.springframework.data:spring-data-mongodb:${springMongoVersion}"
        implementation "org.codehaus.jackson:jackson-core-asl:${jacksonVersion}",
                "org.codehaus.jackson:jackson-mapper-asl:${jacksonVersion}",
                "org.codehaus.jackson:jackson-xc:${jacksonVersion}",
                "org.codehaus.jackson:jackson-jaxrs:${jacksonVersion}"
    }

}

project("jfw-web-core") {
    description = 'SINAVI J-Framework Web'
    defaultTasks 'clean', 'packages'
    dependencies {
        implementation project(':jfw-util-core')
        implementation project(':jfw-resource-core')
        implementation project(':jfw-exception-core')
        implementation project(':jfw-web-util-core')
        implementation "javax.validation:validation-api:${beanValidationVersion}"
        implementation "commons-dbcp:commons-dbcp:${commonsDbcpVersion}"
        implementation "commons-fileupload:commons-fileupload:${commonsFileuploadVersion}"
        implementation "commons-io:commons-io:${commonsIoVersion}"
        implementation "commons-collections:commons-collections:${commonsCollectionsVersion}"
        implementation "commons-codec:commons-codec:${commonsCodecVersion}"
        implementation "org.springframework:spring-core:${springVersion}",
                "org.springframework:spring-context:${springVersion}",
                "org.springframework:spring-beans:${springVersion}",
                "org.springframework:spring-expression:${springVersion}",
                "org.springframework:spring-aop:${springVersion}",
                "org.springframework:spring-web:${springVersion}",
                "org.springframework:spring-webmvc:${springVersion}"
        implementation "commons-validator:commons-validator:${commonsValidatorVersion}"
        implementation "org.aspectj:aspectjrt:${aspectjVersion}"
        testImplementation project(':jfw-test')
        testImplementation "javax.servlet:javax.servlet-api:${servletApiVersion}"
        testImplementation "javax.servlet.jsp:jsp-api:${jspApiVersion}"
        testImplementation "javax.servlet:jstl:${jstlVersion}"
        testImplementation "org.springframework:spring-test:${springVersion}"
        testImplementation "javax.el:javax.el-api:${elVersion}"
        compileOnly "javax.servlet.jsp:jsp-api:${jspApiVersion}"
        compileOnly "javax.servlet:jstl:${jstlVersion}"
    }

}

project("jfw-mybatis-core") {
    description = 'SINAVI J-Framework MyBatis'
    defaultTasks 'clean', 'packages'
    dependencies {
        implementation project(':jfw-util-core')
        implementation project(':jfw-exception-core')
        implementation project(':jfw-web-util-core')
        implementation "org.mybatis:mybatis:${mybatisVersion}"
        implementation "org.mybatis:mybatis-spring:${mybatisSpringVersion}"
