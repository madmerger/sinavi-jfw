buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'gradle.plugin.com.hierynomus.gradle.plugins:license-gradle-plugin:0.16.1'
        classpath 'com.github.spotbugs.snom:spotbugs-gradle-plugin:6.0.26'
    }
}

allprojects {
    apply plugin : 'java-library'
    apply plugin : 'eclipse'
    apply plugin : 'checkstyle'
    apply plugin : 'com.github.spotbugs'
    apply plugin : 'jacoco'
    apply plugin : 'idea'
    apply plugin : 'com.github.hierynomus.license'
    apply plugin : 'signing'
    apply plugin : 'maven-publish'
    apply plugin : 'project-report'

    repositories {
        mavenCentral()
        maven {
            url 'https://repo.spring.io/milestone'
        }
        maven {
            url 'https://repo.spring.io/snapshot'
        }
    }

    eclipse {
        classpath {
            downloadSources=true
        }
    }

    [javadoc]*.options*.encoding = 'UTF-8'
    [compileJava, compileTestJava].each {
        it.sourceCompatibility = 1.8
        it.targetCompatibility = 1.8
        it.options.encoding = 'UTF-8'
    }

    license {
        ext.year = Calendar.getInstance().get(Calendar.YEAR)
        header rootProject.file("${rootDir}/config/LICENSE_TEMPLATE")
        ignoreFailures false
        skipExistingHeaders true
        strictCheck true
        useDefaultMappings false
        mapping('java',"SLASHSTAR_STYLE")
    }

    compileJava.dependsOn("licenseTest")
    compileTestJava.dependsOn("licenseTest")

    configurations {
        all*.exclude group: "commons-logging", module: "commons-logging"
        testImplementation.extendsFrom compileOnly
    }

    ext {
        springVersion = '4.0.2.RELEASE'
        springMongoVersion = '1.4.0.M1'
        springAmqpVersion = '1.3.0.RC1'
        springRetryVersion = '1.0.3.RELEASE'
        jaxRsVersion = '2.0'
        jacksonVersion = '1.9.13'
        jerseyVersion = '2.7'
        mybatisVersion = '3.2.5'
        mybatisSpringVersion = '1.2.2'
        beanValidationVersion = '1.1.0.Final'
        hibernateValidatorVersion = '5.1.0.Final'
        elVersion = '2.2.4'
        commonsFileuploadVersion = '1.3.1'
        commonsValidatorVersion = '1.4.0'
        commonsDbcpVersion = '1.4'
        commonsIoVersion = '2.0.1'
        commonsCollectionsVersion = '3.2.1'
        commonsLangVersion = '2.6'
        commonsCodecVersion = '1.5'
        slf4jVersion = '1.7.6'
        logbackVersion = '1.1.1'
        guavaVersion = '16.0.1'
        openCsvVersion = '2.3'
        
        junitVersion = '4.11'
        mockitoVersion = '1.9.5'
        h2Version = '1.3.173'
        
        servletApiVersion = '3.0.1'
        cglibVersion = '3.1'
        asmVersion = '3.3.1'
        aspectjVersion = '1.7.3'
        jspApiVersion = '2.2'
        jstlVersion = '1.2'
        
        checkstyleVersion = '9.3'
    }

    dependencies {
        api "org.slf4j:slf4j-api:${slf4jVersion}"
        api "ch.qos.logback:logback-classic:${logbackVersion}"
        api "org.slf4j:jcl-over-slf4j:${slf4jVersion}"
        api "com.google.guava:guava:${guavaVersion}"
        api "commons-lang:commons-lang:${commonsLangVersion}"
        testImplementation "junit:junit:${junitVersion}"
        testImplementation "org.mockito:mockito-core:${mockitoVersion}"
        runtimeOnly "cglib:cglib-nodep:${cglibVersion}"
        runtimeOnly "asm:asm:${asmVersion}"
        runtimeOnly "org.aspectj:aspectjweaver:${aspectjVersion}"
        compileOnly "javax.servlet:javax.servlet-api:${servletApiVersion}"
        api "javax.annotation:javax.annotation-api:1.3.2"
    }

    test {
        testLogging {
            events "failed"
            exceptionFormat "full"
            debug {
                events "started", "skipped", "failed"
                exceptionFormat "full"
            }
        }
        exclude '**/*$*'
    }

    checkstyle {
        configFile = file("${rootDir}/config/checkstyle/ctc-checks.xml")
        ignoreFailures = true
        toolVersion = "${checkstyleVersion}"
    }

    spotbugs {
        ignoreFailures = true
    }

    jacoco {
        toolVersion = '0.8.12'
    }

    jacocoTestReport {
        reports {
            xml.required = false
            csv.required = false
            html.outputLocation = layout.buildDirectory.dir("jacocoHtml")
        }
    }

    task resourceCopy(type: Copy) {
        from relativePath(processResources.destinationDir)
        into relativePath(compileTestJava.destinationDir)
        include '**/*.xml'
        include '*.xml'
        include '*.properties'
    }

    test.dependsOn("resourceCopy")

}

configure(subprojects) {subproject ->
    group = 'jp.co.ctc-g.jfw'
    defaultTasks 'clean', 'packages'
    jar {
        doFirst {
            manifest.attributes["Created-By"] =  "${System.getProperty("java.version")}"
            manifest.attributes["Implementation-Vendor"] = 'ITOCHU Techno-Solutions Corporation.'
            manifest.attributes["Implementation-Title"] = subproject.name
            manifest.attributes["Implementation-Version"] = subproject.version
        }
    }
    javadoc {
        options.addStringOption('Xdoclint:none', '-quiet')
        failOnError = false
        doFirst {
            description = "Generates project-level javadoc for use in -javadoc jar"
            options.memberLevel = org.gradle.external.javadoc.JavadocMemberLevel.PROTECTED
            options.author = true
            options.overview = "${rootDir}/config/javadoc/html/overview.html"
            options.charSet = 'UTF-8'
            options.docTitle  = "${subproject.name} ${subproject.version}"
            options.windowTitle  = "${subproject.name} ${subproject.version}"
            options.header = "<h1>${subproject.name}</h1>"
            options.bottom = "<i>Copyright &#169; 2011-2014 ITOCHU Techno-Solutions Corporation.</i>"
            options.destinationDirectory = file("${project.docsDir}/javadoc/${subproject.name}/${subproject.version}/api")
        }
    }

    java {
        withSourcesJar()
        withJavadocJar()
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                pom {
                    name = project.description
                    description = project.description
                    url = 'https://github.com/ctc-g/sinavi-jfw'
                    inceptionYear = '2014'
                    packaging = 'jar'
                    organization {
                        name = 'ITOCHU Techno-Solutions Corporation.'
                        url = 'http://www.ctc-g.co.jp'
                    }
                    licenses {
                        license {
                            name = 'The Apache Software License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                            distribution = 'repo'
                        }
                    }
                    scm {
                        connection = 'scm:git:git://github.com/ctc-g/sinavi-jfw'
                        developerConnection = 'scm:git:git://github.com/ctc-g/sinavi-jfw'
                        url = 'https://github.com/ctc-g/sinavi-jfw'
                    }
                    developers {
                        developer {
                            id = 'sinavi-jfw'
                            name = 'SINAVI J-Framework'
                            email = 'sinavi-jframework@ctc-g.co.jp'
                        }
                    }
                }
            }
        }
        repositories {
            maven {
                def releasesRepoUrl = 'https://oss.sonatype.org/service/local/staging/deploy/maven2'
                def snapshotsRepoUrl = 'https://oss.sonatype.org/content/repositories/snapshots/'
                url = version.toString().endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
                credentials {
                    username = findProperty('sonatypeUsername') ?: ''
                    password = findProperty('sonatypePassword') ?: ''
                }
            }
        }
    }

    signing {
        required {
            gradle.taskGraph.hasTask("publish")
        }
        sign publishing.publications.mavenJava
    }

    task codeChecks(dependsOn: [
        'checkstyleMain',
        'spotbugsMain',
    ])
    task packages(dependsOn: [
        'codeChecks',
        'jar',
        'sourcesJar',
        'javadocJar'
    ])
    artifacts {
        archives sourcesJar
        archives javadocJar
    }
}

project("jfw-util-core") {
    description = 'SINAVI J-Framework Utility'
    defaultTasks 'clean', 'packages'
    dependencies {
        api "commons-collections:commons-collections:${commonsCollectionsVersion}"
        api "org.springframework:spring-beans:${springVersion}"
    }
}

project("jfw-resource-core") {
    description = 'SINAVI J-Framework Resource'
    defaultTasks 'clean', 'packages'
    dependencies {
        api project(':jfw-util-core')
        api "commons-collections:commons-collections:${commonsCollectionsVersion}"
        api "org.springframework:spring-core:${springVersion}",
                "org.springframework:spring-context:${springVersion}"
        testImplementation "org.springframework:spring-test:${springVersion}"
    }
}

project("jfw-exception-core") {
    description = 'SINAVI J-Framework Exception'
    defaultTasks 'clean', 'packages'
    dependencies {
        api project(':jfw-util-core')
        api project(':jfw-resource-core')
        api "commons-collections:commons-collections:${commonsCollectionsVersion}"
        api "org.springframework:spring-core:${springVersion}"
        testImplementation "org.springframework:spring-test:${springVersion}"
    }
}

project("jfw-web-util-core") {
    description = 'SINAVI J-Framework Web Utility'
    defaultTasks 'clean', 'packages'
    dependencies {
        api project(':jfw-util-core')
        api project(':jfw-exception-core')
        api "commons-collections:commons-collections:${commonsCollectionsVersion}"
        api "org.springframework:spring-core:${springVersion}",
                "org.springframework:spring-context:${springVersion}"
        testImplementation "org.springframework:spring-test:${springVersion}"
    }
}

project("jfw-test") {
    description = 'SINAVI J-Framework Test Utility'
    defaultTasks 'clean', 'packages'
    dependencies {
        api project(':jfw-util-core')
        api "commons-io:commons-io:${commonsIoVersion}"
        api "commons-fileupload:commons-fileupload:${commonsFileuploadVersion}"
        api "junit:junit:${junitVersion}"
        api "org.mockito:mockito-core:${mockitoVersion}"
        api "org.springframework:spring-core:${springVersion}",
                "org.springframework:spring-context:${springVersion}",
                "org.springframework:spring-beans:${springVersion}",
                "org.springframework:spring-test:${springVersion}"
    }
}

project("jfw-data-mongodb-test") {
    description = 'SINAVI J-Framework MongoDB Test Utility'
    defaultTasks 'clean', 'packages'
    dependencies {
        api project(':jfw-test')
        api "commons-io:commons-io:${commonsIoVersion}"
        api "commons-fileupload:commons-fileupload:${commonsFileuploadVersion}"
        api "junit:junit:${junitVersion}"
        api "org.mockito:mockito-core:${mockitoVersion}"
        api "org.springframework.data:spring-data-mongodb:${springMongoVersion}"
        api "org.codehaus.jackson:jackson-core-asl:${jacksonVersion}",
                "org.codehaus.jackson:jackson-mapper-asl:${jacksonVersion}",
                "org.codehaus.jackson:jackson-xc:${jacksonVersion}",
                "org.codehaus.jackson:jackson-jaxrs:${jacksonVersion}"
    }
}

project("jfw-web-core") {
    description = 'SINAVI J-Framework Web'
    defaultTasks 'clean', 'packages'
    dependencies {
        api project(':jfw-exception-core')
        api project(':jfw-web-util-core')
        api "javax.validation:validation-api:${beanValidationVersion}"
        api "commons-dbcp:commons-dbcp:${commonsDbcpVersion}"
        api "commons-fileupload:commons-fileupload:${commonsFileuploadVersion}"
        api "commons-io:commons-io:${commonsIoVersion}"
        api "commons-collections:commons-collections:${commonsCollectionsVersion}"
        api "commons-codec:commons-codec:${commonsCodecVersion}"
        api "org.springframework:spring-core:${springVersion}",
                "org.springframework:spring-context:${springVersion}",
                "org.springframework:spring-beans:${springVersion}",
                "org.springframework:spring-expression:${springVersion}",
                "org.springframework:spring-aop:${springVersion}",
                "org.springframework:spring-web:${springVersion}",
                "org.springframework:spring-webmvc:${springVersion}"
        api "commons-validator:commons-validator:${commonsValidatorVersion}"
        implementation "org.aspectj:aspectjweaver:${aspectjVersion}"
        testImplementation project(':jfw-test')
        testImplementation "javax.el:javax.el-api:${elVersion}"
        compileOnly "javax.servlet.jsp:jsp-api:${jspApiVersion}"
        compileOnly "javax.servlet:jstl:${jstlVersion}"
    }
}

project("jfw-mybatis-core") {
    description = 'SINAVI J-Framework MyBatis'
    defaultTasks 'clean', 'packages'
    dependencies {
        api project(':jfw-web-util-core')
        api "org.mybatis:mybatis:${mybatisVersion}"
        api "org.mybatis:mybatis-spring:${mybatisSpringVersion}"
        api "org.springframework:spring-core:${springVersion}",
                "org.springframework:spring-context:${springVersion}",
                "org.springframework:spring-beans:${springVersion}"
        testImplementation project(':jfw-test')
        testImplementation "org.springframework:spring-test:${springVersion}"
        testImplementation "org.springframework:spring-jdbc:${springVersion}"
        testImplementation "commons-dbcp:commons-dbcp:${commonsDbcpVersion}"
        testImplementation "com.h2database:h2:${h2Version}"
    }
}

project("jfw-rest-core") {
    description = 'SINAVI J-Framework REST Client for JAX-RS'
    defaultTasks 'clean', 'packages'
    dependencies {
        api "javax.ws.rs:javax.ws.rs-api:${jaxRsVersion}"
        api "org.codehaus.jackson:jackson-core-asl:${jacksonVersion}",
                "org.codehaus.jackson:jackson-mapper-asl:${jacksonVersion}"
    }
}

project("jfw-rest-plugin-jersey") {
    description = 'SINAVI J-Framework REST Client for JAX-RS (Jersey)'
    defaultTasks 'clean', 'packages'
    dependencies {
        api project(':jfw-util-core')
        api project(':jfw-exception-core')
        api project(':jfw-rest-core')
        api "org.glassfish.jersey.containers:jersey-container-servlet:${jerseyVersion}",
                "org.glassfish.jersey.core:jersey-client:${jerseyVersion}",
                "org.glassfish.jersey.connectors:jersey-grizzly-connector:${jerseyVersion}",
                "org.glassfish.jersey.connectors:jersey-apache-connector:${jerseyVersion}",
                "org.glassfish.jersey.ext:jersey-bean-validation:${jerseyVersion}",
                "org.glassfish.jersey.media:jersey-media-json-jackson:${jerseyVersion}"
        testImplementation "org.glassfish.jersey.test-framework:jersey-test-framework-core:${jerseyVersion}",
                "org.glassfish.jersey.test-framework.providers:jersey-test-framework-provider-simple:${jerseyVersion}",
                "org.glassfish.jersey.test-framework.providers:jersey-test-framework-provider-external:${jerseyVersion}",
                "org.glassfish.jersey.test-framework.providers:jersey-test-framework-provider-default-client:${jerseyVersion}"
        testImplementation project(':jfw-validation-core')
    }
}

project("jfw-rest-plugin-springmvc") {
    description = 'SINAVI J-Framework REST Plugin for SpringMVC'
    defaultTasks 'clean', 'packages'
    dependencies {
        api project(':jfw-rest-core')
        api project(':jfw-exception-core')
        api "org.springframework:spring-context:${springVersion}",
                "org.springframework:spring-test:${springVersion}",
                "org.springframework:spring-web:${springVersion}",
                "org.springframework:spring-webmvc:${springVersion}"
        api 'org.apache.httpcomponents:httpclient:4.3'
        testImplementation "org.springframework:spring-test:${springVersion}"
        testImplementation("org.eclipse.jetty:jetty-servlet:8.1.5.v20120716") {
            exclude group: "org.eclipse.jetty.orbit", module: "javax.servlet"
        }
        testImplementation("org.eclipse.jetty:jetty-server:8.1.5.v20120716") {
            exclude group: "org.eclipse.jetty.orbit", module: "javax.servlet"
        }
    }
}

project("jfw-validation-core") {
    description = 'SINAVI J-Framework Bean Validation'
    defaultTasks 'clean', 'packages'
    dependencies {
        api (project(':jfw-util-core'))
        api "javax.validation:validation-api:${beanValidationVersion}"
        api "org.hibernate:hibernate-validator:${hibernateValidatorVersion}"
        api "javax.el:javax.el-api:${elVersion}"
        api "org.glassfish.web:javax.el:${elVersion}"
        api "commons-validator:commons-validator:${commonsValidatorVersion}"
    }
}

project("jfw-amqp-core") {
    description = 'SINAVI J-Framework AMQP'
    defaultTasks 'clean', 'packages'
    dependencies {
        api project(':jfw-util-core')
        api project(':jfw-exception-core')
        api "org.springframework.amqp:spring-amqp:${springAmqpVersion}",
                "org.springframework.amqp:spring-rabbit:${springAmqpVersion}"
        api "org.springframework.retry:spring-retry:${springRetryVersion}"
        testImplementation "org.springframework:spring-test:${springVersion}"
        testImplementation "org.springframework:spring-tx:${springVersion}"
        runtimeOnly "org.codehaus.jackson:jackson-core-asl:${jacksonVersion}",
                "org.codehaus.jackson:jackson-mapper-asl:${jacksonVersion}"
    }
}

project("jfw-csv-core") {
    description = 'SINAVI J-Framework CSV'
    defaultTasks 'clean', 'packages'
    dependencies {
        api project(':jfw-util-core')
        api project(':jfw-exception-core')
        api project(':jfw-validation-core')
        api "net.sf.opencsv:opencsv:${openCsvVersion}"
        api 'net.sourceforge.collections:collections-generic:4.01'
        api "org.mybatis:mybatis:${mybatisVersion}"
        testImplementation project(':jfw-test')
        testImplementation "org.mybatis:mybatis-spring:${mybatisSpringVersion}"
        testImplementation "org.springframework:spring-jdbc:${springVersion}"
        testImplementation "com.h2database:h2:${h2Version}"
    }
}

