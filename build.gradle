plugins {
    id 'java'
    id 'jacoco'
    id 'signing'
    id 'maven-publish'
    id 'project-report'
    id 'com.github.hierynomus.license' version '0.16.1' apply false
    id 'com.github.spotbugs' version '6.0.26' apply false
}

allprojects {
    apply plugin: 'java-library'
    apply plugin: 'jacoco'
    apply plugin: 'signing'
    apply plugin: 'maven-publish'
    apply plugin: 'project-report'
    apply plugin: 'com.github.hierynomus.license'
    apply plugin: 'checkstyle'
    apply plugin: 'com.github.spotbugs'

    repositories {
        mavenCentral()
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
    }

    license {
        ext.year = Calendar.getInstance().get(Calendar.YEAR)
        header rootProject.file("${rootDir}/config/LICENSE_TEMPLATE")
        ignoreFailures false
        skipExistingHeaders true
        strictCheck true
        useDefaultMappings false
        mapping('java', "SLASHSTAR_STYLE")
    }

    tasks.named('compileJava') {
        dependsOn 'licenseTest'
    }
    tasks.named('compileTestJava') {
        dependsOn 'licenseTest'
    }

    configurations {
        compileOnly
        all*.exclude group: "commons-logging", module: "commons-logging"
    }

    ext {
        springVersion = '6.1.16'
        springMongoVersion = '4.4.3'
        springAmqpVersion = '3.2.4'
        springRetryVersion = '2.0.11'
        jakartaRsVersion = '3.1.0'
        jacksonVersion = '2.18.3'
        jerseyVersion = '3.1.10'
        mybatisVersion = '3.5.19'
        mybatisSpringVersion = '3.0.4'
        jakartaValidationVersion = '3.0.2'
        hibernateValidatorVersion = '8.0.2.Final'
        jakartaElVersion = '5.0.1'
        jakartaElImplVersion = '5.0.0-M1'
        commonsFileuploadVersion = '1.5'
        commonsValidatorVersion = '1.9.0'
        commonsDbcp2Version = '2.13.0'
        commonsIoVersion = '2.18.0'
        commonsCollections4Version = '4.4'
        commonsLang3Version = '3.17.0'
        commonsCodecVersion = '1.17.1'
        slf4jVersion = '2.0.16'
        logbackVersion = '1.5.16'
        guavaVersion = '33.4.0-jre'
        openCsvVersion = '5.9'

        junit5Version = '5.11.4'
        mockitoVersion = '5.14.2'
        h2Version = '2.3.232'

        jakartaServletVersion = '6.0.0'
        aspectjVersion = '1.9.22.1'
        jakartaJspVersion = '3.1.1'
        jakartaJstlVersion = '3.0.1'

        checkstyleVersion = '10.21.4'
    }

    dependencies {
        implementation "org.slf4j:slf4j-api:${slf4jVersion}"
        implementation "ch.qos.logback:logback-classic:${logbackVersion}"
        implementation "org.slf4j:jcl-over-slf4j:${slf4jVersion}"
        implementation "com.google.guava:guava:${guavaVersion}"
        implementation "org.apache.commons:commons-lang3:${commonsLang3Version}"
        testImplementation "org.junit.jupiter:junit-jupiter:${junit5Version}"
        testImplementation "junit:junit:4.13.2"
        testRuntimeOnly "org.junit.vintage:junit-vintage-engine:${junit5Version}"
        testImplementation "org.hamcrest:hamcrest:2.2"
        testImplementation "org.mockito:mockito-core:${mockitoVersion}"
        testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
        checkstyle "com.puppycrawl.tools:checkstyle:${checkstyleVersion}"
        runtimeOnly "org.aspectj:aspectjweaver:${aspectjVersion}"
        compileOnly "jakarta.servlet:jakarta.servlet-api:${jakartaServletVersion}"
    }

    test {
        useJUnitPlatform()
        testLogging {
            events "failed"
            exceptionFormat "full"
            debug {
                events "started", "skipped", "failed"
                exceptionFormat "full"
            }
        }
        exclude '**/*$*'
    }

    checkstyle {
        configFile = file("${rootDir}/config/checkstyle/ctc-checks.xml")
        ignoreFailures = true
        toolVersion = checkstyleVersion
    }

    spotbugs {
        ignoreFailures = true
    }

    jacoco {
        toolVersion = '0.8.12'
    }

    jacocoTestReport {
        reports {
            xml.required = false
            csv.required = false
            html.outputLocation = layout.buildDirectory.dir("jacocoHtml")
        }
    }

    tasks.register('resourceCopy', Copy) {
        dependsOn processResources
        from processResources.destinationDir
        into compileTestJava.destinationDirectory
        include '**/*.xml'
        include '*.xml'
        include '*.properties'
    }

    test.dependsOn("resourceCopy")

}

configure(subprojects) { subproject ->
    group = 'jp.co.ctc-g.jfw'
    defaultTasks 'clean', 'packages'
    jar {
        doFirst {
            manifest.attributes["Created-By"] = "${System.getProperty("java.version")}"
            manifest.attributes["Implementation-Vendor"] = 'ITOCHU Techno-Solutions Corporation.'
            manifest.attributes["Implementation-Title"] = subproject.name
            manifest.attributes["Implementation-Version"] = subproject.version
        }
    }
    javadoc {
        doFirst {
            description = "Generates project-level javadoc for use in -javadoc jar"
            options.memberLevel = org.gradle.external.javadoc.JavadocMemberLevel.PROTECTED
            options.author = true
            options.overview = "${rootDir}/config/javadoc/html/overview.html"
            options.charSet = 'UTF-8'
            options.docTitle = "${subproject.name} ${subproject.version}"
            options.windowTitle = "${subproject.name} ${subproject.version}"
            options.header = "<h1>${subproject.name}</h1>"
            options.bottom = "<i>Copyright &#169; 2011-2014 ITOCHU Techno-Solutions Corporation.</i>"
            options.destinationDirectory = file("${project.layout.buildDirectory.get().asFile}/docs/javadoc/${subproject.name}/${subproject.version}/api")
            options.addStringOption('Xdoclint:none', '-quiet')
        }
    }
    signing {
        required {
            gradle.taskGraph.hasTask("publish")
        }
        sign publishing.publications
    }
    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                pom {
                    groupId = 'jp.co.ctc-g.jfw'
                    packaging = 'jar'
                    inceptionYear = '2014'
                    url = 'https://github.com/madmerger/sinavi-jfw'
                    organization {
                        name = 'ITOCHU Techno-Solutions Corporation.'
                        url = 'http://www.ctc-g.co.jp'
                    }
                    licenses {
                        license {
                            name = 'The Apache Software License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                            distribution = 'repo'
                        }
                    }
                    scm {
                        connection = 'scm:git:git://github.com/madmerger/sinavi-jfw'
                        developerConnection = 'scm:git:git://github.com/madmerger/sinavi-jfw'
                        url = 'https://github.com/madmerger/sinavi-jfw'
                    }
                    developers {
                        developer {
                            id = 'sinavi-jfw'
                            name = 'SINAVI J-Framework'
                            email = 'sinavi-jframework@ctc-g.co.jp'
                        }
                    }
                }
            }
        }
        repositories {
            maven {
                def releasesRepoUrl = 'https://oss.sonatype.org/service/local/staging/deploy/maven2'
                def snapshotsRepoUrl = 'https://oss.sonatype.org/content/repositories/snapshots/'
                url = version.toString().endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
                credentials {
                    username = findProperty('sonatypeUsername') ?: System.getenv('SONATYPE_USERNAME') ?: ''
                    password = findProperty('sonatypePassword') ?: System.getenv('SONATYPE_PASSWORD') ?: ''
                }
            }
        }
    }
    tasks.register('sourcesJar', Jar) {
        archiveClassifier = "sources"
        from sourceSets.main.allJava.srcDirs
        include "**/*.java"
    }
    tasks.register('javadocJar', Jar) {
        dependsOn javadoc
        archiveClassifier = "javadoc"
        from javadoc.destinationDir
    }
    tasks.register('codeChecks') {
        dependsOn 'checkstyleMain', 'spotbugsMain'
    }
    tasks.register('packages') {
        dependsOn 'codeChecks', 'jar', 'sourcesJar', 'javadocJar'
    }
}

project("jfw-util-core") {
    description = 'SINAVI J-Framework Utility'
    defaultTasks 'clean', 'packages'
    dependencies {
        implementation "org.apache.commons:commons-collections4:${commonsCollections4Version}"
        implementation "org.springframework:spring-beans:${springVersion}"
    }
}

project("jfw-resource-core") {
    description = 'SINAVI J-Framework Resource'
    defaultTasks 'clean', 'packages'
    dependencies {
        api project(':jfw-util-core')
        implementation "org.apache.commons:commons-collections4:${commonsCollections4Version}"
        implementation "org.springframework:spring-core:${springVersion}",
                "org.springframework:spring-context:${springVersion}"
        testImplementation "org.springframework:spring-test:${springVersion}"
    }
}

