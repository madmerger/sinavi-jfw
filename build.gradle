plugins {
    id 'com.github.spotbugs' version '6.0.13' apply false
    id 'com.github.hierynomus.license' version '0.16.1' apply false
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'eclipse'
    apply plugin: 'checkstyle'
    apply plugin: 'com.github.spotbugs'
    apply plugin: 'jacoco'
    apply plugin: 'idea'
    apply plugin: 'com.github.hierynomus.license'
    apply plugin: 'project-report'

    repositories {
        mavenCentral()
        maven { url 'https://repo.spring.io/plugins-release' }
        maven { url 'https://repo.spring.io/snapshot' }
        maven { url 'https://repo.spring.io/milestone' }
    }

    eclipse {
        classpath {
            downloadSources = true
        }
    }

    [javadoc]*.options*.encoding = 'UTF-8'
    [compileJava, compileTestJava].each {
        it.sourceCompatibility = JavaVersion.VERSION_17
        it.targetCompatibility = JavaVersion.VERSION_17
        it.options.encoding = 'UTF-8'
    }

    license {
        ext.year = Calendar.getInstance().get(Calendar.YEAR)
        header rootProject.file("${rootDir}/config/LICENSE_TEMPLATE")
        ignoreFailures false
        skipExistingHeaders true
        strictCheck true
        useDefaultMappings false
        mapping('java', 'SLASHSTAR_STYLE')
    }

    compileJava.dependsOn('licenseTest')
    compileTestJava.dependsOn('licenseTest')

    configurations {
        all*.exclude group: 'commons-logging', module: 'commons-logging'
        // Checkstyle 10 系が Guava と google-collections の両方を引き込み、
        // 同一 capability で競合するため、deprecated な google-collections を除外する。
        all*.exclude group: 'com.google.collections', module: 'google-collections'
    }

    ext {
        springVersion = '4.0.2.RELEASE'
        springMongoVersion = '1.4.0.M1'
        springAmqpVersion = '1.3.0.RC1'
        springRetryVersion = '1.0.3.RELEASE'
        jaxRsVersion = '2.0'
        jacksonVersion = '1.9.13'
        jerseyVersion = '2.7'
        mybatisVersion = '3.2.5'
        mybatisSpringVersion = '1.2.2'
        beanValidationVersion = '1.1.0.Final'
        hibernateValidatorVersion = '5.1.0.Final'
        elVersion = '2.2.4'
        commonsFileuploadVersion = '1.3.1'
        commonsValidatorVersion = '1.4.0'
        commonsDbcpVersion = '1.4'
        commonsIoVersion = '2.0.1'
        commonsCollectionsVersion = '3.2.1'
        commonsLangVersion = '2.6'
        commonsCodecVersion = '1.5'
        slf4jVersion = '1.7.6'
        logbackVersion = '1.1.1'
        guavaVersion = '16.0.1'
        openCsvVersion = '2.3'

        junitVersion = '4.11'
        mockitoVersion = '1.9.5'
        h2Version = '1.3.173'

        servletApiVersion = '3.0.1'
        cglibVersion = '3.1'
        asmVersion = '3.3.1'
        aspectjVersion = '1.7.3'
        jspApiVersion = '2.2'
        jstlVersion = '1.2'

        checkstyleVersion = '10.14.0'
        spotbugsToolVersion = '4.8.3'
    }

    dependencies {
        api "org.slf4j:slf4j-api:${slf4jVersion}"
        api "ch.qos.logback:logback-classic:${logbackVersion}"
        api "org.slf4j:jcl-over-slf4j:${slf4jVersion}"
        api "com.google.guava:guava:${guavaVersion}"
        api "commons-lang:commons-lang:${commonsLangVersion}"
        testImplementation "junit:junit:${junitVersion}"
        testImplementation "org.mockito:mockito-core:${mockitoVersion}"
        runtimeOnly "cglib:cglib-nodep:${cglibVersion}"
        runtimeOnly "asm:asm:${asmVersion}"
        // aspectjweaver はソースコードで org.aspectj.lang.* をコンパイル時に参照するため
        // 旧 Gradle の `runtime` (compile classpath にも乗っていた) と同等の挙動にするには
        // implementation/api 扱いが必要。Gradle 8 の `runtimeOnly` は runtime only。
        api "org.aspectj:aspectjweaver:${aspectjVersion}"
        compileOnly "javax.servlet:javax.servlet-api:${servletApiVersion}"
        // javax.annotation: JDK 11 以降 javax.annotation パッケージが JDK から削除されたため、
        // ソースで javax.annotation.Resource を参照するテストコードのコンパイルに必要。
        compileOnly "javax.annotation:javax.annotation-api:1.3.2"
        // 旧 `provided` (compile.extendsFrom provided) はテストコンパイル時にも有効だった。
        // Gradle 8 の compileOnly は test compile classpath には伝搬しないため、
        // 同等の挙動を維持するために testCompileOnly を明示する。
        testCompileOnly "javax.servlet:javax.servlet-api:${servletApiVersion}"
        testCompileOnly "javax.annotation:javax.annotation-api:1.3.2"
    }

    test {
        testLogging {
            events 'failed'
            exceptionFormat 'full'
            debug {
                events 'started', 'skipped', 'failed'
                exceptionFormat 'full'
            }
        }
        exclude '**/*$*'
    }

    checkstyle {
        configFile = file("${rootDir}/config/checkstyle/ctc-checks.xml")
        ignoreFailures = true
        toolVersion = checkstyleVersion
    }

    spotbugs {
        ignoreFailures = true
        toolVersion = spotbugsToolVersion
    }

    jacoco {
        toolVersion = '0.8.11'
    }

    jacocoTestReport {
        reports {
            xml.required = false
            csv.required = false
            html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
        }
    }

    task resourceCopy(type: Copy) {
        from processResources
        into compileTestJava.destinationDirectory
        include '**/*.xml'
        include '*.xml'
        include '*.properties'
    }

    test.dependsOn('resourceCopy')
}

configure(subprojects) { subproject ->
    group = 'jp.co.ctc-g.jfw'
    defaultTasks 'clean', 'packages'
    jar {
        doFirst {
            manifest.attributes['Created-By'] = "${System.getProperty('java.version')}"
            manifest.attributes['Implementation-Vendor'] = 'ITOCHU Techno-Solutions Corporation.'
            manifest.attributes['Implementation-Title'] = subproject.name
            manifest.attributes['Implementation-Version'] = subproject.version
        }
    }
    javadoc {
        doFirst {
            description = 'Generates project-level javadoc for use in -javadoc jar'
            options.memberLevel = org.gradle.external.javadoc.JavadocMemberLevel.PROTECTED
            options.author = true
            options.overview = "${rootDir}/config/javadoc/html/overview.html"
            options.charSet = 'UTF-8'
            options.docTitle = "${subproject.name} ${subproject.version}"
            options.windowTitle = "${subproject.name} ${subproject.version}"
            options.header = "<h1>${subproject.name}</h1>"
            options.bottom = '<i>Copyright &#169; 2011-2014 ITOCHU Techno-Solutions Corporation.</i>'
            options.destinationDirectory = file("${layout.buildDirectory.get().asFile}/docs/javadoc/${subproject.name}/${subproject.version}/api")
            // Java 17 の javadoc は HTML 厳格チェックを行うため、レガシーコメント (HTML4) で
            // エラーになる。ソースコードを変更しないため doclint を無効化する。
            options.addStringOption('Xdoclint:none', '-quiet')
        }
    }
    task sourcesJar(type: Jar, dependsOn: classes) {
        archiveClassifier = 'sources'
        from sourceSets.main.allJava.srcDirs
        include '**/*.java'
    }
    task javadocJar(type: Jar, dependsOn: javadoc) {
        archiveClassifier = 'javadoc'
        from javadoc.destinationDir
    }
    task codeChecks(dependsOn: [
        'checkstyleMain',
        'spotbugsMain',
    ])
    task packages(dependsOn: [
        'codeChecks',
        'jar',
        'sourcesJar',
        'javadocJar'
    ])
    artifacts {
        archives sourcesJar
        archives javadocJar
    }
}

project('jfw-util-core') {
