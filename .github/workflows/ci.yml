name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean build -x spotbugsMain -x spotbugsTest -x checkstyleMain -x checkstyleTest -x :jfw-amqp-core:test -x :jfw-csv-core:test -x :jfw-mybatis-core:test -x :jfw-rest-plugin-jersey:test -x :jfw-rest-plugin-springmvc:test -x :jfw-validation-core:test -x :jfw-web-core:test
