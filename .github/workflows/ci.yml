name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build -x test -x javadoc --no-daemon

      - name: Test
        run: |
          ./gradlew test --no-daemon \
            -x :jfw-amqp-core:test \
            -x :jfw-csv-core:test \
            -x :jfw-mybatis-core:test \
            -x :jfw-rest-plugin-springmvc:test \
            -x :jfw-rest-plugin-springmvc:compileTestJava \
            -x :jfw-validation-core:test \
            -x :jfw-web-core:test \
            -x :jfw-web-core:compileTestJava \
            -x :jfw-web-util-core:test \
            -x :jfw-web-util-core:compileTestJava
        env:
          TERM: dumb
